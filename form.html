<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форма — Илон Маск · Википедия</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F1F8E9;
            color: #1B3A24;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 40px;
            border: 1px solid #2E7D32;
        }
        h1, h2 {
            font-family: Georgia, serif;
            font-weight: normal;
            border-bottom: 1px solid #2E7D32;
            padding-bottom: 10px;
        }
        h1 { font-size: 32px; margin-top: 0; }
        p { line-height: 1.6; margin-bottom: 15px; }
        a { color: #2E7D32; text-decoration: none; }
        a:hover { text-decoration: underline; }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        nav a {
            display: block;
            padding: 8px 12px;
            color: #1B3A24;
            border: 1px solid #2E7D32;
            border-radius: 6px;
            text-decoration: none;
            background-color: #F1F8E9;
            font-weight: bold;
        }
        nav a:hover {
            background-color: #2E7D32;
            color: #ffffff;
            text-decoration: none;
        }

        /* Убрали обводку у всей формы */
        form {
            margin-top: 20px;
        }

        form p {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #1B3A24;
        }

        select, input[type="number"], textarea {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            border: 1px solid #2E7D32;
            border-radius: 4px;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* КЛАСС ДЛЯ ЗЕЛЁНЫХ РАМОК */
        .form-box {
            background-color: #F1F8E9;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #A5D6A7;
            margin-bottom: 20px;
            /* Ограничиваем ширину, чтобы рамка не растягивалась на весь экран */
            max-width: 450px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .checkbox-group:last-child {
            margin-bottom: 0;
        }

        .checkbox-group input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            display: inline;
            margin-bottom: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 400px;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: #2E7D32;
        }

        .range-text {
            font-size: 14px;
            color: #1B3A24;
            white-space: nowrap;
        }

        button {
            background-color: #2E7D32;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1B3A24;
        }
    </style>
</head>
<body>

    <div class="container">

        <nav>
            <a href="index1.html">Главная</a>
            <a href="catalog1.html">Каталог</a>
        </nav>

        <h1>Форма заявки</h1>
        <p>Учебная форма. Данные пока не сохраняются.</p>

        <form method="get">

            <!-- ПЕРВАЯ РАМКА: Компания и Количество -->
            <div class="form-box">
                <p>
                    <label for="company">Выберите компанию</label>
                    <select id="company" name="company" required>
                        <option value="">Выберите из списка</option>
                        <option value="spacex">SpaceX</option>
                        <option value="tesla">Tesla</option>
                        <option value="neuralink">Neuralink</option>
                    </select>
                </p>

                <p style="margin-bottom: 0;">
                    <label for="quantity">Количество человек (от 1)</label>
                    <input id="quantity" name="quantity" type="number" min="1" step="1" value="1" required>
                </p>
            </div>

            <!-- ВТОРАЯ РАМКА: Комментарий -->
            <div class="form-box">
                <p style="margin-bottom: 0;">
                    <label for="notes">Комментарий к заявке</label>
                    <textarea id="notes" name="notes" rows="4" placeholder="Например, удобная дата или особые пожелания"></textarea>
                </p>
            </div>

            <!-- ОСТАЛЬНЫЕ ЭЛЕМЕНТЫ БЕЗ РАМКИ -->
            <div class="checkbox-group">
                <input id="extra1" name="extra1" type="checkbox" value="yes" checked>
                <label for="extra1">Нужен русскоязычный гид</label>
            </div>
            <div class="checkbox-group">
                <input id="extra2" name="extra2" type="checkbox" value="yes">
                <label for="extra2">Нужен трансфер</label>
            </div>

            <p style="margin-top: 20px;">
                <label for="level">Уровень срочности</label>
                <div class="range-container">
                    <span class="range-text">1 — Не срочно</span>
                    <input id="level" name="level" type="range" min="1" max="5" step="1" value="3">
                    <span class="range-text">5 — Срочно</span>
                </div>
            </p>

            <p style="margin-top: 30px;">
                <button type="submit">Отправить заявку</button>
            </p>

        </form>

    </div>

</body>
</html>
